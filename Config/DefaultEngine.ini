; Outbreak Commander - engine configuration
; Targets UE5.4 with Nanite + Lumen enabled for the visual goals in the brief
; (PBR materials, dynamic GI, volumetric fog, cinematic post-processing).

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/MAP_PrototypeCity.MAP_PrototypeCity
GameDefaultMap=/Game/Maps/MAP_PrototypeCity.MAP_PrototypeCity
GlobalDefaultGameMode=/Game/Blueprints/BP_OCGameMode.BP_OCGameMode_C
GameInstanceClass=/Script/OutbreakCommander.OCGameInstance

[/Script/Engine.RendererSettings]
; Lumen dynamic global illumination + reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; Nanite virtualized geometry
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution (UE5 default AA); DLSS/FSR/XeSS are configured per-platform below
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
; Volumetrics
r.VolumetricFog=True
; Virtual shadow maps for large outdoor maps
r.Shadow.Virtual.Enable=1
; Scalability
r.ViewDistanceScale=1.0
bSmoothFrameRate=True
SmoothedFrameRateRange=(Lower=22.0,Upper=62.0)

[/Script/Engine.RendererOverrideSettings]
; Upscaling (DLSS/FSR/XeSS) is exposed per-platform in DefaultPlatform.ini overrides

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DLSS (NVIDIA), FSR (AMD), XeSS (Intel) are selected in the in-game graphics menu
; via the engine's upscaling settings; defaults target quality mode at 1080p60.

[/Script/Engine.Engine]
; Deterministic simulation: the game logic lives in SimulationCore (pure C++),
; so frame-rate independence comes from the fixed-timestep sim, not the engine.
bUseFixedFrameRate=False
GameUserSettingsClassName=/Script/OutbreakCommander.OCGameUserSettings
GameScreenshotSaveDirectory=(Path="Saved/Screenshots")
NearClipPlane=5.0

[/Script/Engine.PhysicsSettings]
; Prototype uses simple collision on buildings/walls; Chaos is available for
; destruction physics in later phases.
DefaultGravityZ=-980.0

[/Script/Engine.CollisionProfile]
; Profiles: OC_World (ground), OC_Unit, OC_Building, OC_Wall are defined in
; DefaultEngine.ini of the game module or the project collision settings.

[/Script/Engine.WorldSettings]
; MAP_PrototypeCity is the vertical-slice district. Additional cities stream
; via World Partition (one 256m grid cell per sim district) — see docs/08.

[OnlineSubsystem]
DefaultPlatformService=Steam

