; Outbreak Commander - input bindings (Enhanced Input).
; The UInputAction / UInputMappingContext assets referenced by
; AOCPlayerController live under Content/Input and must be created in the
; editor (they are .uasset files). This file holds the legacy fallback and
; documents the action set:
;
;   IA_PanX / IA_PanY     - camera pan (WASD / arrow keys)
;   IA_Zoom               - camera zoom (mouse wheel)
;   IA_Rotate             - camera rotate (Q/E, or RMB drag)
;   IA_BuildConfirm       - LMB: place building / confirm wall drag
;   IA_BuildCancel        - RMB / Esc: cancel build mode / drag
;   IA_Pause              - P / Esc: pause
;   IA_SpeedUp            - Space: toggle 2x simulation speed
;   IA_Select             - LMB (no build mode): select unit/building
;   IA_CameraPreset1..4   - 1..4: snap to districts / points of interest

[InputSettings]
bEnableLegacyInputScales=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bDefaultViewportMouseLockOnCapture=True
DefaultInputComponentClassName=/Script/EnhancedInput.EnhancedInputComponent
bFilterInputByPlatform=True

[/Script/EnhancedInput.EnhancedInputSettings]
; Controller support (Xbox/PlayStation via Steam Input) is configured with an
; IMC_Gamepad mapping context mirroring IMC_Default (brief section 13).
